name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: unmango/actions/setup-nix@c984cd3bb34111da20c9366bc2beb72674960f64 # v1.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix develop --command make validate

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: unmango/actions/setup-nix@c984cd3bb34111da20c9366bc2beb72674960f64 # v1.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: make lint
